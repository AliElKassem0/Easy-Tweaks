# Builds the Windows app on a GitHub-hosted Windows machine.
# Runs on every push to main, or by hand: GitHub repo -> Actions -> "Build Windows" -> Run workflow.
name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Caches compiled Rust dependencies, so later runs take minutes instead of ~15
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      # Includes the WindowsRegistry test, which writes to a throwaway key
      # (HKCU\Software\EasyTweaksTest) on the build machine, not on your PC
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: easy-tweaks-windows
          path: |
            src-tauri/target/release/easy-tweaks.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
